<script>
"use strict";

// ==================== Vector2 ====================
class Vector2 {
  constructor(x = 0, y = 0) { this.x = x; this.y = y; }
  static zero() { return new Vector2(0, 0); }
  static fromAngle(a, m = 1) { return new Vector2(Math.cos(a) * m, Math.sin(a) * m); }
  clone() { return new Vector2(this.x, this.y); }
  add(v) { return new Vector2(this.x + v.x, this.y + v.y); }
  sub(v) { return new Vector2(this.x - v.x, this.y - v.y); }
  scale(s) { return new Vector2(this.x * s, this.y * s); }
  magnitude() { return Math.sqrt(this.x * this.x + this.y * this.y); }
  magnitudeSq() { return this.x * this.x + this.y * this.y; }
  normalize() { const m = this.magnitude(); return m === 0 ? Vector2.zero() : new Vector2(this.x / m, this.y / m); }
  dot(v) { return this.x * v.x + this.y * v.y; }
  cross(v) { return this.x * v.y - this.y * v.x; }
  distanceTo(v) { return this.sub(v).magnitude(); }
  distanceToSq(v) { return this.sub(v).magnitudeSq(); }
  angle() { return Math.atan2(this.y, this.x); }
  lerp(v, t) { return new Vector2(this.x + (v.x - this.x) * t, this.y + (v.y - this.y) * t); }
  addMut(v) { this.x += v.x; this.y += v.y; return this; }
  scaleMut(s) { this.x *= s; this.y *= s; return this; }
}

// ==================== Constants ====================
const G = 6.674e3;
const PHYSICS_DT = 1 / 60;
const ORBIT_PREDICTION_STEPS = 600;
const ORBIT_PREDICTION_DT = 0.5;
const TIME_WARP_LEVELS = [1, 5, 10, 50];

// ==================== CelestialBody ====================
class CelestialBody {
  constructor(cfg) {
    this.name = cfg.name; this.mass = cfg.mass; this.radius = cfg.radius;
    this.position = cfg.position.clone(); this.velocity = cfg.velocity.clone();
    this.color = cfg.color; this.atmosphereColor = cfg.atmosphereColor || cfg.color;
    this.atmosphereRadius = cfg.atmosphereRadius || cfg.radius * 1.15;
    this.fixed = cfg.fixed || false; this.acceleration = Vector2.zero();
  }
}

// ==================== PhysicsWorld ====================
class PhysicsWorld {
  constructor() { this.bodies = []; }
  addBody(b) { this.bodies.push(b); }
  calculateGravityAcceleration(pos, exclude) {
    let ax = 0, ay = 0;
    for (const body of this.bodies) {
      if (body === exclude) continue;
      const dx = body.position.x - pos.x, dy = body.position.y - pos.y;
      const distSq = dx * dx + dy * dy;
      const dist = Math.sqrt(distSq);
      const soft = body.radius * 0.5;
      const effDistSq = distSq + soft * soft;
      const force = G * body.mass / effDistSq;
      ax += (dx / dist) * force; ay += (dy / dist) * force;
    }
    return new Vector2(ax, ay);
  }
  findDominantBody(pos) {
    let strongest = null, strongestForce = 0;
    for (const body of this.bodies) {
      const distSq = pos.distanceToSq(body.position);
      const force = G * body.mass / Math.max(distSq, 1);
      if (force > strongestForce) { strongestForce = force; strongest = body; }
    }
    return strongest;
  }
  update(dt) {
    for (const body of this.bodies) {
      if (body.fixed) { body.acceleration = Vector2.zero(); continue; }
      body.acceleration = this.calculateGravityAcceleration(body.position, body);
    }
    for (const body of this.bodies) {
      if (body.fixed) continue;
      body.position.x += body.velocity.x * dt + 0.5 * body.acceleration.x * dt * dt;
      body.position.y += body.velocity.y * dt + 0.5 * body.acceleration.y * dt * dt;
    }
    const newAccs = [];
    for (const body of this.bodies) {
      if (body.fixed) { newAccs.push(Vector2.zero()); continue; }
      newAccs.push(this.calculateGravityAcceleration(body.position, body));
    }
    for (let i = 0; i < this.bodies.length; i++) {
      const body = this.bodies[i]; if (body.fixed) continue;
      body.velocity.x += 0.5 * (body.acceleration.x + newAccs[i].x) * dt;
      body.velocity.y += 0.5 * (body.acceleration.y + newAccs[i].y) * dt;
      body.acceleration = newAccs[i];
    }
  }
}

// ==================== OrbitalMechanics ====================
class OrbitalMechanics {
  static predictOrbit(position, velocity, world, steps = ORBIT_PREDICTION_STEPS, dt = ORBIT_PREDICTION_DT) {
    const points = []; let pos = position.clone(), vel = velocity.clone();
    let isEscape = false, willCollide = false, collisionBody;
    const startDom = world.findDominantBody(pos);
    const startDist = startDom ? pos.distanceTo(startDom.position) : Infinity;
    for (let i = 0; i < steps; i++) {
      const acc = world.calculateGravityAcceleration(pos);
      pos = new Vector2(pos.x + vel.x * dt + 0.5 * acc.x * dt * dt, pos.y + vel.y * dt + 0.5 * acc.y * dt * dt);
      const newAcc = world.calculateGravityAcceleration(pos);
      vel = new Vector2(vel.x + 0.5 * (acc.x + newAcc.x) * dt, vel.y + 0.5 * (acc.y + newAcc.y) * dt);
      points.push(pos.clone());
      for (const body of world.bodies) {
        if (pos.distanceTo(body.position) < body.radius) { willCollide = true; collisionBody = body; return { points, isEscape, willCollide, collisionBody }; }
      }
      if (startDom && pos.distanceTo(startDom.position) > startDist * 3) isEscape = true;
    }
    return { points, isEscape, willCollide, collisionBody };
  }
  static calculateOrbitalElements(position, velocity, body) {
    const relPos = position.sub(body.position), relVel = velocity.sub(body.velocity);
    const r = relPos.magnitude(), v = relVel.magnitude(), mu = G * body.mass;
    const energy = 0.5 * v * v - mu / r;
    if (energy >= 0) return null;
    const a = -mu / (2 * energy), h = relPos.cross(relVel);
    const eSq = 1 + (2 * energy * h * h) / (mu * mu);
    const e = Math.sqrt(Math.max(0, eSq));
    return { apoapsis: a * (1 + e), periapsis: a * (1 - e), eccentricity: e, period: 2 * Math.PI * Math.sqrt((a * a * a) / mu), semiMajorAxis: a };
  }
  static circularOrbitVelocity(body, distance) { return Math.sqrt(G * body.mass / distance); }
}

// ==================== Ship ====================
class Ship {
  constructor(cfg) {
    this.position = cfg.position.clone(); this.velocity = cfg.velocity.clone();
    this.rotation = cfg.rotation; this.angularVelocity = 0;
    this.thrustPower = cfg.thrustPower; this.rotationSpeed = cfg.rotationSpeed;
    this.fuel = cfg.maxFuel; this.maxFuel = cfg.maxFuel; this.fuelConsumption = cfg.fuelConsumption;
    this.isThrusting = false; this.isBoosting = false; this.throttle = 1;
    this.acceleration = Vector2.zero();
  }
  get thrustDirection() { return Vector2.fromAngle(this.rotation); }
  applyThrust(dt) {
    if (this.fuel <= 0 || !this.isThrusting) return Vector2.zero();
    const power = this.isBoosting ? this.thrustPower * 2.5 : this.thrustPower;
    const consumption = this.isBoosting ? this.fuelConsumption * 3 : this.fuelConsumption;
    this.fuel = Math.max(0, this.fuel - consumption * dt * this.throttle);
    return this.thrustDirection.scale(power * this.throttle);
  }
  rotateLeft(dt) { this.rotation -= this.rotationSpeed * dt; }
  rotateRight(dt) { this.rotation += this.rotationSpeed * dt; }
  get fuelPercent() { return this.fuel / this.maxFuel; }
  get speed() { return this.velocity.magnitude(); }
}

// ==================== Solar System Factory ====================
function createSolarSystem() {
  const world = new PhysicsWorld();
  const star = new CelestialBody({ name: 'Sol', mass: 5e6, radius: 120, position: Vector2.zero(), velocity: Vector2.zero(), color: 0xFFDD44, atmosphereColor: 0xFFAA00, atmosphereRadius: 168, fixed: true });
  world.addBody(star);

  function makePlanet(name, mass, radius, dist, parent, color, atmColor, angle) {
    angle = angle !== undefined ? angle : Math.random() * Math.PI * 2;
    const pos = parent.position.add(Vector2.fromAngle(angle, dist));
    const speed = OrbitalMechanics.circularOrbitVelocity(parent, dist);
    const vel = parent.velocity.add(Vector2.fromAngle(angle + Math.PI / 2, speed));
    return new CelestialBody({ name, mass, radius, position: pos, velocity: vel, color, atmosphereColor: atmColor, atmosphereRadius: atmColor ? radius * 1.2 : undefined, fixed: false });
  }

  const mercury = makePlanet('Mercury', 800, 12, 1200, star, 0xAAAA88, null, 0.5);
  const venus = makePlanet('Venus', 2000, 20, 2200, star, 0xDDAA55, 0xFFCC88, 1.2);
  const earth = makePlanet('Earth', 3000, 24, 3500, star, 0x4488FF, 0x88BBFF, 2.1);
  const mars = makePlanet('Mars', 1500, 16, 5000, star, 0xCC6644, 0xDD8866, 3.5);
  const jupiter = makePlanet('Jupiter', 15000, 50, 8000, star, 0xDDBB88, 0xEECC99, 4.8);
  const planets = [mercury, venus, earth, mars, jupiter];
  planets.forEach(p => world.addBody(p));

  const luna = makePlanet('Luna', 200, 8, 200, earth, 0xCCCCCC, null, 0);
  const phobos = makePlanet('Phobos', 80, 5, 120, mars, 0xAA9988, null, 1);
  const europa = makePlanet('Europa', 300, 10, 250, jupiter, 0xBBCCDD, null, 0.5);
  const io = makePlanet('Io', 250, 9, 160, jupiter, 0xDDCC44, null, 2.0);
  const moons = [luna, phobos, europa, io];
  moons.forEach(m => world.addBody(m));

  const shipOrbitDist = 100;
  const shipPos = earth.position.add(Vector2.fromAngle(0, shipOrbitDist));
  const shipOrbitSpeed = OrbitalMechanics.circularOrbitVelocity(earth, shipOrbitDist);
  const shipVel = earth.velocity.add(Vector2.fromAngle(Math.PI / 2, shipOrbitSpeed));
  const ship = new Ship({ position: shipPos, velocity: shipVel, rotation: -Math.PI / 2, thrustPower: 50, rotationSpeed: 3, maxFuel: 1000, fuelConsumption: 2 });

  return { world, star, planets, moons, ship };
}

// ==================== Camera ====================
class Camera {
  constructor() {
    this.position = Vector2.zero(); this.zoom = 1; this.targetZoom = 1;
    this.mode = 'follow_ship'; this.followTarget = null;
    this.screenWidth = 0; this.screenHeight = 0;
    this.minZoom = 0.001; this.maxZoom = 5; this.zoomSpeed = 0.1; this.zoomSmoothing = 0.15;
  }
  setScreenSize(w, h) { this.screenWidth = w; this.screenHeight = h; }
  setFollowTarget(t) { this.followTarget = t; if (t) this.mode = 'follow_ship'; }
  adjustZoom(delta) {
    const f = delta > 0 ? 1 - this.zoomSpeed : 1 + this.zoomSpeed;
    this.targetZoom = Math.max(this.minZoom, Math.min(this.maxZoom, this.targetZoom * f));
  }
  update() {
    this.zoom += (this.targetZoom - this.zoom) * this.zoomSmoothing;
    if (this.mode === 'follow_ship' && this.followTarget) this.position = this.position.lerp(this.followTarget.position, 0.1);
    else if (this.mode === 'focus_planet' && this.followTarget) this.position = this.followTarget.position.clone();
  }
  worldToScreen(wp) { return new Vector2((wp.x - this.position.x) * this.zoom + this.screenWidth / 2, (wp.y - this.position.y) * this.zoom + this.screenHeight / 2); }
  worldToScreenScale(d) { return d * this.zoom; }
  pan(dx, dy) { this.position = this.position.add(new Vector2(dx / this.zoom, dy / this.zoom)); }
}

// ==================== InputManager ====================
class InputManager {
  constructor() {
    this.keys = new Set(); this.keysJustPressed = new Set();
    this._pinchDelta = 0; this.lastPinchDist = 0;
    this._isMobile = false; this.canvas = null;
  }
  get isMobile() { return this._isMobile; }
  get pinchDelta() { return this._pinchDelta; }
  init(canvas) {
    this.canvas = canvas;
    this._isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    window.addEventListener('keydown', this._onKeyDown);
    window.addEventListener('keyup', this._onKeyUp);
    canvas.addEventListener('wheel', this._onWheel, { passive: false });
    canvas.addEventListener('touchstart', this._onTouchStart, { passive: false });
    canvas.addEventListener('touchmove', this._onTouchMove, { passive: false });
    canvas.addEventListener('touchend', this._onTouchEnd, { passive: false });
    canvas.addEventListener('touchcancel', this._onTouchEnd, { passive: false });
  }
  destroy() {
    window.removeEventListener('keydown', this._onKeyDown);
    window.removeEventListener('keyup', this._onKeyUp);
    if (this.canvas) {
      this.canvas.removeEventListener('wheel', this._onWheel);
      this.canvas.removeEventListener('touchstart', this._onTouchStart);
      this.canvas.removeEventListener('touchmove', this._onTouchMove);
      this.canvas.removeEventListener('touchend', this._onTouchEnd);
      this.canvas.removeEventListener('touchcancel', this._onTouchEnd);
    }
  }
  endFrame() { this.keysJustPressed.clear(); this._scrollDelta = 0; this._pinchDelta = 0; }
  isKeyDown(k) { return this.keys.has(k.toLowerCase()); }
  isKeyJustPressed(k) { return this.keysJustPressed.has(k.toLowerCase()); }
  getScrollDelta() { return this._scrollDelta || 0; }
  simulateKeyDown(k) { k = k.toLowerCase(); if (!this.keys.has(k)) this.keysJustPressed.add(k); this.keys.add(k); }
  simulateKeyUp(k) { this.keys.delete(k.toLowerCase()); }
  _onKeyDown = (e) => {
    const k = e.key.toLowerCase();
    if (!this.keys.has(k)) this.keysJustPressed.add(k);
    this.keys.add(k);
    if (['w','a','s','d',' ','shift','tab',',','.'].includes(k)) e.preventDefault();
  };
  _onKeyUp = (e) => { this.keys.delete(e.key.toLowerCase()); };
  _onWheel = (e) => { e.preventDefault(); this._scrollDelta = (this._scrollDelta || 0) + e.deltaY; };
  _onTouchStart = (e) => {
    e.preventDefault();
    if (e.touches.length === 2) { const t1 = e.touches[0], t2 = e.touches[1]; this.lastPinchDist = Math.sqrt((t2.clientX-t1.clientX)**2 + (t2.clientY-t1.clientY)**2); }
  };
  _onTouchMove = (e) => {
    e.preventDefault();
    if (e.touches.length === 2) {
      const t1 = e.touches[0], t2 = e.touches[1];
      const dist = Math.sqrt((t2.clientX-t1.clientX)**2 + (t2.clientY-t1.clientY)**2);
      if (this.lastPinchDist > 0) this._pinchDelta += (this.lastPinchDist - dist) * 3;
      this.lastPinchDist = dist;
    }
  };
  _onTouchEnd = (e) => { e.preventDefault(); if (e.touches.length < 2) this.lastPinchDist = 0; };
}

// ==================== Starfield ====================
class Starfield {
  constructor(app, w, h) {
    this.container = new PIXI.Container(); this.layers = []; this.width = w; this.height = h;
    this._createLayer(200, 0.02, 0.5, 1.0);
    this._createLayer(100, 0.05, 1.0, 1.5);
    this._createLayer(50, 0.1, 1.5, 2.5);
  }
  _createLayer(count, pf, minS, maxS) {
    const g = new PIXI.Graphics(); const stars = [];
    for (let i = 0; i < count; i++) stars.push({ x: (Math.random()-0.5)*4000, y: (Math.random()-0.5)*4000, brightness: 0.3+Math.random()*0.7, size: minS+Math.random()*(maxS-minS) });
    this.container.addChild(g); this.layers.push({ graphics: g, stars, parallaxFactor: pf });
  }
  render(cam) {
    for (const layer of this.layers) {
      layer.graphics.clear();
      const ox = -cam.position.x * layer.parallaxFactor, oy = -cam.position.y * layer.parallaxFactor;
      for (const s of layer.stars) {
        let sx = ((s.x + ox) % this.width + this.width) % this.width;
        let sy = ((s.y + oy) % this.height + this.height) % this.height;
        const alpha = s.brightness * (0.7 + 0.3 * Math.sin(Date.now() * 0.001 + s.x));
        const color = s.brightness > 0.8 ? 0xCCDDFF : s.brightness > 0.5 ? 0xFFFFFF : 0xAABBCC;
        layer.graphics.circle(sx, sy, s.size); layer.graphics.fill({ color, alpha });
      }
    }
  }
}

// ==================== PlanetRenderer ====================
class PlanetRenderer {
  constructor() { this.container = new PIXI.Container(); this.g = new PIXI.Graphics(); this.container.addChild(this.g); }
  render(bodies, cam) {
    this.g.clear();
    for (const b of bodies) {
      const sp = cam.worldToScreen(b.position), sr = cam.worldToScreenScale(b.radius);
      if (sp.x < -sr*2 || sp.x > cam.screenWidth+sr*2 || sp.y < -sr*2 || sp.y > cam.screenHeight+sr*2) continue;
      if (sr < 0.5) continue;
      if (b.atmosphereColor && b.atmosphereRadius > b.radius) {
        const ar = cam.worldToScreenScale(b.atmosphereRadius);
        this.g.circle(sp.x, sp.y, ar); this.g.fill({ color: b.atmosphereColor, alpha: 0.08 });
        this.g.circle(sp.x, sp.y, sr + (ar-sr)*0.5); this.g.fill({ color: b.atmosphereColor, alpha: 0.12 });
      }
      this.g.circle(sp.x, sp.y, sr); this.g.fill({ color: b.color });
      if (sr > 3) { this.g.circle(sp.x + sr*0.15, sp.y - sr*0.1, sr); this.g.fill({ color: 0x000000, alpha: 0.25 }); }
      if (b.fixed && sr > 2) { for (let i = 1; i <= 3; i++) { this.g.circle(sp.x, sp.y, sr*(1+i*0.4)); this.g.fill({ color: b.atmosphereColor || b.color, alpha: 0.04/i }); } }
    }
  }
}

// ==================== ShipRenderer ====================
class ShipRenderer {
  constructor() { this.container = new PIXI.Container(); this.g = new PIXI.Graphics(); this.container.addChild(this.g); }
  render(ship, cam) {
    this.g.clear();
    const sp = cam.worldToScreen(ship.position), sc = Math.max(1, cam.zoom * 12);
    const nose = Vector2.fromAngle(ship.rotation, sc*1.2);
    const lw = Vector2.fromAngle(ship.rotation + Math.PI*0.8, sc*0.8);
    const rw = Vector2.fromAngle(ship.rotation - Math.PI*0.8, sc*0.8);
    const tail = Vector2.fromAngle(ship.rotation + Math.PI, sc*0.4);
    const pts = [
      {x:sp.x+nose.x,y:sp.y+nose.y},{x:sp.x+lw.x,y:sp.y+lw.y},
      {x:sp.x+tail.x,y:sp.y+tail.y},{x:sp.x+rw.x,y:sp.y+rw.y}
    ];
    this.g.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) this.g.lineTo(pts[i].x,pts[i].y);
    this.g.closePath(); this.g.stroke({color:0x44AAFF,width:2,alpha:0.4});
    this.g.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) this.g.lineTo(pts[i].x,pts[i].y);
    this.g.closePath(); this.g.fill({color:0x88CCFF,alpha:0.9});
    if (ship.isThrusting && ship.fuel > 0) {
      const fd = Vector2.fromAngle(ship.rotation+Math.PI);
      const fl = sc*(0.8+Math.random()*0.6)*(ship.isBoosting?1.8:1);
      const fb1 = Vector2.fromAngle(ship.rotation+Math.PI*0.9,sc*0.3);
      const fb2 = Vector2.fromAngle(ship.rotation-Math.PI*0.9,sc*0.3);
      const ft = fd.scale(fl);
      this.g.moveTo(sp.x+fb1.x,sp.y+fb1.y); this.g.lineTo(sp.x+ft.x,sp.y+ft.y); this.g.lineTo(sp.x+fb2.x,sp.y+fb2.y);
      this.g.closePath(); this.g.fill({color:ship.isBoosting?0xFF4400:0xFF8800,alpha:0.7});
      const il=fl*0.6,it=fd.scale(il);
      const ib1=Vector2.fromAngle(ship.rotation+Math.PI*0.92,sc*0.15);
      const ib2=Vector2.fromAngle(ship.rotation-Math.PI*0.92,sc*0.15);
      this.g.moveTo(sp.x+ib1.x,sp.y+ib1.y); this.g.lineTo(sp.x+it.x,sp.y+it.y); this.g.lineTo(sp.x+ib2.x,sp.y+ib2.y);
      this.g.closePath(); this.g.fill({color:0xFFDD44,alpha:0.9});
    }
    const ind = Vector2.fromAngle(ship.rotation, sc*2);
    this.g.moveTo(sp.x+nose.x,sp.y+nose.y); this.g.lineTo(sp.x+ind.x,sp.y+ind.y);
    this.g.stroke({color:0x44AAFF,width:1,alpha:0.3});
  }
}

// ==================== ParticleSystem ====================
class ParticleSystem {
  constructor() { this.container = new PIXI.Container(); this.g = new PIXI.Graphics(); this.container.addChild(this.g); this.particles = []; this.pool = []; }
  emit(pos, vel, count, cfg) {
    for (let i = 0; i < count; i++) {
      if (this.particles.length >= 500) break;
      const a = vel.angle() + (Math.random()-0.5)*cfg.spread;
      const s = cfg.speed*(0.5+Math.random()*0.5);
      const pv = Vector2.fromAngle(a,s).add(vel.scale(0.3));
      let p;
      if (this.pool.length > 0) { p = this.pool.pop(); p.position = pos.clone(); p.velocity = pv; p.life = cfg.life; p.maxLife = cfg.life; p.color = cfg.color; p.size = cfg.size*(0.5+Math.random()*0.5); }
      else p = { position: pos.clone(), velocity: pv, life: cfg.life, maxLife: cfg.life, color: cfg.color, size: cfg.size*(0.5+Math.random()*0.5) };
      this.particles.push(p);
    }
  }
  update(dt) {
    for (let i = this.particles.length-1; i >= 0; i--) {
      const p = this.particles[i];
      p.position.addMut(p.velocity.scale(dt)); p.velocity.scaleMut(0.98); p.life -= dt;
      if (p.life <= 0) this.pool.push(this.particles.splice(i,1)[0]);
    }
  }
  render(cam) {
    this.g.clear();
    for (const p of this.particles) {
      const sp = cam.worldToScreen(p.position);
      const alpha = (p.life/p.maxLife)*0.8, size = Math.max(1, p.size*cam.zoom);
      this.g.circle(sp.x,sp.y,size); this.g.fill({color:p.color,alpha});
    }
  }
}

// ==================== OrbitRenderer ====================
class OrbitRenderer {
  constructor() { this.container = new PIXI.Container(); this.g = new PIXI.Graphics(); this.container.addChild(this.g); }
  render(pred, cam) {
    this.g.clear(); if (!pred || pred.points.length < 2) return;
    const pts = pred.points;
    let color = pred.willCollide ? 0xFF4444 : pred.isEscape ? 0xFF8844 : 0x44FF88;
    const total = pts.length, seg = Math.max(1, Math.floor(total/150));
    for (let i = 0; i < total-seg; i += seg) {
      const p1 = cam.worldToScreen(pts[i]), p2 = cam.worldToScreen(pts[Math.min(i+seg,total-1)]);
      const alpha = 0.6*(1-i/total);
      this.g.moveTo(p1.x,p1.y); this.g.lineTo(p2.x,p2.y); this.g.stroke({color,width:1.5,alpha});
    }
    if (pred.willCollide) {
      const ip = cam.worldToScreen(pts[pts.length-1]); const s = 6;
      this.g.moveTo(ip.x-s,ip.y-s); this.g.lineTo(ip.x+s,ip.y+s); this.g.stroke({color:0xFF4444,width:2,alpha:0.8});
      this.g.moveTo(ip.x+s,ip.y-s); this.g.lineTo(ip.x-s,ip.y+s); this.g.stroke({color:0xFF4444,width:2,alpha:0.8});
    }
  }
  renderBodyOrbits(bodies, center, cam) {
    for (const b of bodies) {
      const dx=b.position.x-center.x,dy=b.position.y-center.y;
      const or=Math.sqrt(dx*dx+dy*dy);
      const sc=cam.worldToScreen(center), sr=cam.worldToScreenScale(or);
      if (sr > 5 && sr < 10000) { this.g.circle(sc.x,sc.y,sr); this.g.stroke({color:0xFFFFFF,width:0.5,alpha:0.08}); }
    }
  }
}

class HUD {

    const ms = isMobile ? 11 : 13, ds = isMobile ? 9 : 11, pad = isMobile ? 10 : 16, lh = isMobile ? 15 : 18;
    const mainSt = { fontFamily: 'GameMono, monospace', fontSize: ms, fill: 0x88CCFF, dropShadow: {blur:2,color:0x000000,distance:0,alpha:0.8} };
    const dimSt = { fontFamily: 'GameMono, monospace', fontSize: ds, fill: 0x667788, dropShadow: {blur:2,color:0x000000,distance:0,alpha:0.8} };
    const accSt = { fontFamily: 'GameMono, monospace', fontSize: ms, fill: 0x44FF88, dropShadow: {blur:2,color:0x000000,distance:0,alpha:0.8} };
    const warpSt = { fontFamily: 'GameMono, monospace', fontSize: isMobile?12:14, fill: 0xFFDD44, dropShadow: {blur:2,color:0x000000,distance:0,alpha:0.8} };
    this.velText = new PIXI.Text({text:'',style:mainSt}); this.velText.position.set(pad,pad); this.container.addChild(this.velText);
    this.altText = new PIXI.Text({text:'',style:mainSt}); this.altText.position.set(pad,pad+lh); this.container.addChild(this.altText);
    this.bodyText = new PIXI.Text({text:'',style:accSt}); this.bodyText.position.set(pad,pad+lh*2); this.container.addChild(this.bodyText);
    this.orbitText = new PIXI.Text({text:'',style:dimSt}); this.orbitText.position.set(pad,pad+lh*3); this.container.addChild(this.orbitText);
    this.warpText = new PIXI.Text({text:'',style:warpSt}); this.warpText.anchor.set(0.5,0); this.warpText.position.set(sw/2,pad); this.container.addChild(this.warpText);
    const fbo = isMobile ? 190 : 40;
    this.fuelBar = new PIXI.Graphics(); this.fuelBar.position.set(pad, sh - fbo); this.container.addChild(this.fuelBar);
    this.fuelText = new PIXI.Text({text:'',style:mainSt}); this.fuelText.position.set(pad, sh - fbo - 18); this.container.addChild(this.fuelText);
    this.ctrlText = new PIXI.Text({text: isMobile ? '' : 'W: Thrust  A/D: Rotate  Shift: Boost\n,/.: Time Warp  C: Camera  R: Reset', style:dimSt});
    this.ctrlText.anchor.set(1,1); this.ctrlText.position.set(sw-pad,sh-pad); this.container.addChild(this.ctrlText);
    this.pad = pad; this.fbo = fbo;
  }
  update(ship, dom, tw) {
    this.velText.text = `VEL ${ship.speed.toFixed(1)} m/s`;
    if (dom) {
      const alt = ship.position.distanceTo(dom.position) - dom.radius;
      this.altText.text = `ALT ${alt.toFixed(0)} m`; this.bodyText.text = `SOI: ${dom.name}`;
      const el = OrbitalMechanics.calculateOrbitalElements(ship.position, ship.velocity, dom);
      if (el) {
        this.orbitText.text = this.isMobile ?
          `AP:${el.apoapsis.toFixed(0)} PE:${el.periapsis.toFixed(0)} E:${el.eccentricity.toFixed(2)}` :
          `AP: ${el.apoapsis.toFixed(0)}  PE: ${el.periapsis.toFixed(0)}  ECC: ${el.eccentricity.toFixed(3)}  T: ${el.period.toFixed(1)}s`;
      } else this.orbitText.text = 'ESCAPE TRAJECTORY';
    } else { this.altText.text = 'ALT ---'; this.bodyText.text = 'SOI: Deep Space'; this.orbitText.text = ''; }
    this.warpText.text = tw > 1 ? `>>> x${tw} >>>` : '';
    this.fuelBar.clear();
    const bw = this.isMobile ? Math.min(150, this.sw*0.35) : 200, bh = this.isMobile ? 6 : 8;
    this.fuelBar.rect(0,0,bw,bh); this.fuelBar.fill({color:0x222233});
    const fw = bw * ship.fuelPercent, fc = ship.fuelPercent > 0.3 ? 0x44FF88 : ship.fuelPercent > 0.1 ? 0xFFDD44 : 0xFF4444;
    this.fuelBar.rect(0,0,fw,bh); this.fuelBar.fill({color:fc});
    this.fuelBar.rect(0,0,bw,bh); this.fuelBar.stroke({color:0x445566,width:1});
    this.fuelText.text = `FUEL ${(ship.fuelPercent*100).toFixed(0)}%`;
  }
  resize(w,h) {
    this.sw=w; this.sh=h;
    this.warpText.position.set(w/2,this.pad);
    this.fuelBar.position.set(this.pad,h-this.fbo);
    this.fuelText.position.set(this.pad,h-this.fbo-18);
    this.ctrlText.position.set(w-this.pad,h-this.pad);
  }
}

// ==================== Minimap ====================
class Minimap {
  constructor(size) {
    this.size = size || 180; this.container = new PIXI.Container();
    this.bg = new PIXI.Graphics(); this.container.addChild(this.bg);
    this.g = new PIXI.Graphics(); this.container.addChild(this.g);
    this.mapScale = 0.012;
  }
  setPosition(sw,sh) { this.container.position.set(sw-this.size-12, 12); }
  render(bodies, ship) {
    this.bg.clear(); this.g.clear();
    this.bg.roundRect(0,0,this.size,this.size,4); this.bg.fill({color:0x0a0a14,alpha:0.8});
    this.bg.roundRect(0,0,this.size,this.size,4); this.bg.stroke({color:0x334455,width:1});
    const cx=this.size/2, cy=this.size/2;
    for (const b of bodies) {
      const mx=cx+b.position.x*this.mapScale, my=cy+b.position.y*this.mapScale;
      if (mx<-5||mx>this.size+5||my<-5||my>this.size+5) continue;
      const ds = b.fixed ? 4 : Math.max(1.5, b.radius*this.mapScale*2);
      this.g.circle(mx,my,ds); this.g.fill({color:b.color});
    }
    const sx=cx+ship.position.x*this.mapScale, sy=cy+ship.position.y*this.mapScale;
    const clx=Math.max(3,Math.min(this.size-3,sx)), cly=Math.max(3,Math.min(this.size-3,sy));
    this.g.circle(clx,cly,2.5); this.g.fill({color:0x44AAFF});
    const d=Vector2.fromAngle(ship.rotation,6);
    this.g.moveTo(clx,cly); this.g.lineTo(clx+d.x,cly+d.y); this.g.stroke({color:0x44AAFF,width:1,alpha:0.6});
  }
  resize(sw,sh) { this.setPosition(sw,sh); }
}

// ==================== TouchControls ====================
class TouchControls {
  constructor(input, sw, sh) {
    this.input = input; this.sw = sw; this.sh = sh; this.visible = false;
    this.container = new PIXI.Container(); this.g = new PIXI.Graphics(); this.container.addChild(this.g);
    this.labels = new Map();
    this.joystickBase = {x:0,y:0,radius:60}; this.joystickKnob = {x:0,y:0,radius:24};
    this.joystickActive = false; this.joystickTouchId = null; this.joystickMagnitude = 0;
    this.buttons = []; this.topButtons = [];
    this._setupControls();
    this._setupLabels();
    window.addEventListener('touchstart', this._ts, {passive:false});
    window.addEventListener('touchmove', this._tm, {passive:false});
    window.addEventListener('touchend', this._te, {passive:false});
    window.addEventListener('touchcancel', this._te, {passive:false});
  }
  _setupControls() {
    const sw=this.sw, sh=this.sh;
    const br = Math.min(32, sw*0.06), bbr = Math.min(42, sw*0.08);
    this.joystickBase.x = 90; this.joystickBase.y = sh - 120;
    this.joystickBase.radius = Math.min(60, sw*0.11);
    this.joystickKnob.x = this.joystickBase.x; this.joystickKnob.y = this.joystickBase.y;
    this.joystickKnob.radius = Math.min(24, sw*0.045);
    const rx = sw - 80, by = sh - 100;
    this.buttons = [
      {id:'thrust',x:rx,y:by-bbr*2.4,radius:bbr,label:'THR',key:'w',active:false,touchId:null},
      {id:'boost',x:rx-bbr*2.2,y:by,radius:br,label:'BST',key:'shift',active:false,touchId:null},
      {id:'reset',x:rx,y:by,radius:br,label:'RST',key:'r',active:false,touchId:null},
    ];
    const sb = Math.min(22, sw*0.04);
    this.topButtons = [
      {id:'warp_down',x:sw/2-60,y:50,radius:sb,label:'<<',key:',',active:false,touchId:null},
      {id:'warp_up',x:sw/2+60,y:50,radius:sb,label:'>>',key:'.',active:false,touchId:null},
      {id:'zoom_in',x:sw-40,y:sh/2-40,radius:sb,label:'+',key:'__zoom_in',active:false,touchId:null},
      {id:'zoom_out',x:sw-40,y:sh/2+40,radius:sb,label:'-',key:'__zoom_out',active:false,touchId:null},
    ];
  }
  _setupLabels() {
    this.labels.forEach(t => t.destroy()); this.labels.clear();
    const st = {fontFamily:'GameMono, monospace',fontSize:10,fill:0xAABBCC,align:'center'};
    for (const z of [...this.buttons,...this.topButtons]) {
      const t = new PIXI.Text({text:z.label,style:st}); t.anchor.set(0.5,0.5); t.position.set(z.x,z.y);
      this.container.addChild(t); this.labels.set(z.id,t);
    }
  }
  destroy() {
    window.removeEventListener('touchstart',this._ts);
    window.removeEventListener('touchmove',this._tm);
    window.removeEventListener('touchend',this._te);
    window.removeEventListener('touchcancel',this._te);
    this.labels.forEach(t => t.destroy());
  }
  _ts = (e) => {
    if (!this.visible) return;
    for (let i=0;i<e.changedTouches.length;i++) {
      const t=e.changedTouches[i], x=t.clientX, y=t.clientY;
      const jd=Math.sqrt((x-this.joystickBase.x)**2+(y-this.joystickBase.y)**2);
      if (jd < this.joystickBase.radius*1.5 && !this.joystickActive) {
        this.joystickActive=true; this.joystickTouchId=t.identifier; this._updateJoystick(x,y); continue;
      }
      for (const b of [...this.buttons,...this.topButtons]) {
        if (Math.sqrt((x-b.x)**2+(y-b.y)**2) < b.radius*1.5) {
          b.active=true; b.touchId=t.identifier;
          if (b.key!=='__zoom_in'&&b.key!=='__zoom_out') this.input.simulateKeyDown(b.key);
        }
      }
    }
  };
  _tm = (e) => {
    if (!this.visible) return;
    for (let i=0;i<e.changedTouches.length;i++) {
      const t=e.changedTouches[i];
      if (t.identifier===this.joystickTouchId) this._updateJoystick(t.clientX,t.clientY);
    }
  };
  _te = (e) => {
    if (!this.visible) return;
    for (let i=0;i<e.changedTouches.length;i++) {
      const t=e.changedTouches[i];
      if (t.identifier===this.joystickTouchId) {
        this.joystickActive=false; this.joystickTouchId=null;
        this.joystickKnob.x=this.joystickBase.x; this.joystickKnob.y=this.joystickBase.y; this.joystickMagnitude=0;
        this.input.simulateKeyUp('a'); this.input.simulateKeyUp('d'); this.input.simulateKeyUp('w'); this.input.simulateKeyUp('s');
      }
      for (const b of [...this.buttons,...this.topButtons]) {
        if (b.touchId===t.identifier) { b.active=false; b.touchId=null; if(b.key!=='__zoom_in'&&b.key!=='__zoom_out') this.input.simulateKeyUp(b.key); }
      }
    }
  };
  _updateJoystick(tx,ty) {
    const dx=tx-this.joystickBase.x, dy=ty-this.joystickBase.y;
    const dist=Math.sqrt(dx*dx+dy*dy), max=this.joystickBase.radius;
    const cd=Math.min(dist,max), a=Math.atan2(dy,dx);
    this.joystickKnob.x=this.joystickBase.x+Math.cos(a)*cd; this.joystickKnob.y=this.joystickBase.y+Math.sin(a)*cd;
    this.joystickMagnitude=cd/max;
    const nx=(this.joystickKnob.x-this.joystickBase.x)/max, ny=(this.joystickKnob.y-this.joystickBase.y)/max, th=0.25;
    if(nx<-th){this.input.simulateKeyDown('a');this.input.simulateKeyUp('d');}
    else if(nx>th){this.input.simulateKeyDown('d');this.input.simulateKeyUp('a');}
    else{this.input.simulateKeyUp('a');this.input.simulateKeyUp('d');}
    if(ny<-th) this.input.simulateKeyDown('w'); else this.input.simulateKeyUp('w');
  }
  getZoomDelta() {
    let d=0;
    for(const b of this.topButtons){if(b.active){if(b.key==='__zoom_in')d-=50;if(b.key==='__zoom_out')d+=50;}}
    return d;
  }
  render() {
    if(!this.visible){this.container.visible=false;return;} this.container.visible=true; this.g.clear();
    // Joystick base
    this.g.circle(this.joystickBase.x,this.joystickBase.y,this.joystickBase.radius);
    this.g.fill({color:0x112233,alpha:0.4});
    this.g.circle(this.joystickBase.x,this.joystickBase.y,this.joystickBase.radius);
    this.g.stroke({color:0x334466,width:2,alpha:0.5});
    // Knob
    const kc=this.joystickActive?0x44AAFF:0x6688AA, ka=this.joystickActive?0.8:0.5;
    this.g.circle(this.joystickKnob.x,this.joystickKnob.y,this.joystickKnob.radius);
    this.g.fill({color:kc,alpha:ka});
    this.g.circle(this.joystickKnob.x,this.joystickKnob.y,this.joystickKnob.radius);
    this.g.stroke({color:0x88CCFF,width:1.5,alpha:ka});
    // Buttons
    for(const b of this.buttons){
      const c=b.active?this._ac(b.id):0x112233, bc=b.active?this._ac(b.id):0x334466, a=b.active?0.7:0.35;
      this.g.circle(b.x,b.y,b.radius); this.g.fill({color:c,alpha:a});
      this.g.circle(b.x,b.y,b.radius); this.g.stroke({color:bc,width:2,alpha:a+0.2});
      const l=this.labels.get(b.id); if(l) l.style.fill=b.active?0xFFFFFF:0xAABBCC;
    }
    for(const b of this.topButtons){
      const c=b.active?0x445566:0x112233, a=b.active?0.6:0.3;
      this.g.circle(b.x,b.y,b.radius); this.g.fill({color:c,alpha:a});
      this.g.circle(b.x,b.y,b.radius); this.g.stroke({color:0x445566,width:1.5,alpha:a+0.15});
    }
  }
  _ac(id) { return id==='thrust'?0xFF8800:id==='boost'?0xFF4400:id==='reset'?0x4488FF:0x445566; }
  resize(w,h) { this.sw=w; this.sh=h; this._setupControls(); this._setupLabels(); }
}

// ==================== GAME ====================
class Game {
  constructor() {
    this.app = new PIXI.Application();
    this.camera = new Camera(); this.input = new InputManager();
    this.timeWarpIndex = 0; this.orbitPrediction = null; this.orbitPredictionTimer = 0;
    this.running = false; this.accumulator = 0; this.lastTime = 0;
  }
  async init(container) {
    const w = container.clientWidth, h = container.clientHeight;
    await this.app.init({ width:w, height:h, backgroundColor:0x050510, antialias:true, resolution:window.devicePixelRatio||1, autoDensity:true });
    container.appendChild(this.app.canvas);
    this.input.init(this.app.canvas);
    this.camera.setScreenSize(w, h);
    const data = createSolarSystem();
    this.world = data.world; this.star = data.star; this.planets = data.planets; this.moons = data.moons; this.ship = data.ship;
    const isMobile = this.input.isMobile;
    this.starfield = new Starfield(this.app, w, h);
    this.planetRenderer = new PlanetRenderer();
    this.shipRenderer = new ShipRenderer();
    this.particles = new ParticleSystem();
    this.orbitRenderer = new OrbitRenderer();
    const mmSize = isMobile ? Math.min(120, Math.floor(w*0.28)) : 180;
    this.hud = new HUD(w, h, isMobile);
    this.minimap = new Minimap(mmSize);
    this.minimap.setPosition(w, h);
    this.touchControls = new TouchControls(this.input, w, h);
    this.touchControls.visible = isMobile;
    this.app.stage.addChild(this.starfield.container);
    this.app.stage.addChild(this.orbitRenderer.container);
    this.app.stage.addChild(this.planetRenderer.container);
    this.app.stage.addChild(this.particles.container);
    this.app.stage.addChild(this.shipRenderer.container);
    this.app.stage.addChild(this.hud.container);
    this.app.stage.addChild(this.minimap.container);
    this.app.stage.addChild(this.touchControls.container);
    this.camera.setFollowTarget(this.ship); this.camera.targetZoom = 0.8;
    window.addEventListener('resize', this._onResize);
    this.running = true; this.lastTime = performance.now(); this._loop();
  }
  destroy() {
    this.running = false; window.removeEventListener('resize', this._onResize);
    this.input.destroy(); this.touchControls.destroy(); this.app.destroy(true, {children:true});
  }
  _onResize = () => {
    const p = this.app.canvas.parentElement; if(!p) return;
    const w=p.clientWidth, h=p.clientHeight;
    this.app.renderer.resize(w,h); this.camera.setScreenSize(w,h);
    this.hud.resize(w,h); this.minimap.resize(w,h); this.touchControls.resize(w,h);
  };
  _loop = () => {
    if (!this.running) return;
    const now = performance.now(), ft = Math.min((now-this.lastTime)/1000, 0.1);
    this.lastTime = now;
    const tw = TIME_WARP_LEVELS[this.timeWarpIndex];
    this.accumulator += ft * tw;
    while (this.accumulator >= PHYSICS_DT) { this._processInput(PHYSICS_DT); this._updatePhysics(PHYSICS_DT); this.accumulator -= PHYSICS_DT; }
    this._render(); this.input.endFrame();
    requestAnimationFrame(this._loop);
  };
  _processInput(dt) {
    if (this.input.isKeyDown('w')||this.input.isKeyDown('arrowup')) this.ship.isThrusting = true;
    else this.ship.isThrusting = false;
    this.ship.isBoosting = this.input.isKeyDown('shift');
    if (this.input.isKeyDown('a')||this.input.isKeyDown('arrowleft')) this.ship.rotateLeft(dt);
    if (this.input.isKeyDown('d')||this.input.isKeyDown('arrowright')) this.ship.rotateRight(dt);
    if (this.input.isKeyJustPressed('.')) this.timeWarpIndex = Math.min(this.timeWarpIndex+1, TIME_WARP_LEVELS.length-1);
    if (this.input.isKeyJustPressed(',')) this.timeWarpIndex = Math.max(this.timeWarpIndex-1, 0);
    const scroll = this.input.getScrollDelta(), pinch = this.input.pinchDelta, tz = this.touchControls.getZoomDelta();
    const totalZoom = scroll + pinch + tz;
    if (totalZoom !== 0) this.camera.adjustZoom(totalZoom);
    if (this.input.isKeyJustPressed('c')) {
      if (this.camera.mode==='follow_ship') this.camera.mode='free_cam';
      else { this.camera.mode='follow_ship'; this.camera.setFollowTarget(this.ship); }
    }
    if (this.camera.mode==='free_cam') {
      const ps=500/this.camera.zoom;
      if(this.input.isKeyDown('w')||this.input.isKeyDown('arrowup')) this.camera.pan(0,-ps*dt);
      if(this.input.isKeyDown('s')||this.input.isKeyDown('arrowdown')) this.camera.pan(0,ps*dt);
      if(this.input.isKeyDown('a')||this.input.isKeyDown('arrowleft')) this.camera.pan(-ps*dt,0);
      if(this.input.isKeyDown('d')||this.input.isKeyDown('arrowright')) this.camera.pan(ps*dt,0);
    }
    if (this.input.isKeyJustPressed('r')) this._resetShip();
    if (this.ship.isThrusting && this.timeWarpIndex > 0) this.timeWarpIndex = 0;
  }
  _updatePhysics(dt) {
    this.world.update(dt);
    const grav = this.world.calculateGravityAcceleration(this.ship.position);
    const thrust = this.ship.applyThrust(dt);
    const totalAcc = grav.add(thrust);
    this.ship.position.x += this.ship.velocity.x*dt + 0.5*this.ship.acceleration.x*dt*dt;
    this.ship.position.y += this.ship.velocity.y*dt + 0.5*this.ship.acceleration.y*dt*dt;
    const ng = this.world.calculateGravityAcceleration(this.ship.position);
    const nt = this.ship.isThrusting ? this.ship.thrustDirection.scale(this.ship.isBoosting?this.ship.thrustPower*2.5:this.ship.thrustPower).scale(this.ship.fuel>0?this.ship.throttle:0) : Vector2.zero();
    const nta = ng.add(nt);
    this.ship.velocity.x += 0.5*(totalAcc.x+nta.x)*dt;
    this.ship.velocity.y += 0.5*(totalAcc.y+nta.y)*dt;
    this.ship.acceleration = nta;
    if (this.ship.isThrusting && this.ship.fuel > 0) {
      const ed = Vector2.fromAngle(this.ship.rotation+Math.PI);
      this.particles.emit(this.ship.position.add(ed.scale(8)), ed.scale(80), this.ship.isBoosting?3:1,
        {color:this.ship.isBoosting?0xFF4400:0xFF8800,speed:40,spread:0.5,life:0.6,size:2.5});
    }
    for (const b of this.world.bodies) { if (this.ship.position.distanceTo(b.position) < b.radius+5) { this._resetShip(); break; } }
    this.particles.update(dt);
    this.orbitPredictionTimer += dt;
    if (this.orbitPredictionTimer >= 0.1) {
      this.orbitPredictionTimer = 0;
      this.orbitPrediction = OrbitalMechanics.predictOrbit(this.ship.position, this.ship.velocity, this.world);
    }
  }
  _render() {
    this.camera.update();
    this.starfield.render(this.camera);
    this.orbitRenderer.render(this.orbitPrediction, this.camera);
    const nfb = this.world.bodies.filter(b => !b.fixed);
    this.orbitRenderer.renderBodyOrbits(nfb, this.star.position, this.camera);
    this.planetRenderer.render(this.world.bodies, this.camera);
    this.particles.render(this.camera);
    this.shipRenderer.render(this.ship, this.camera);
    const dom = this.world.findDominantBody(this.ship.position);
    this.hud.update(this.ship, dom, TIME_WARP_LEVELS[this.timeWarpIndex]);
    this.minimap.render(this.world.bodies, this.ship);
    this.touchControls.render();
  }
  _resetShip() {
    const data = createSolarSystem();
    this.ship.position = data.ship.position.clone(); this.ship.velocity = data.ship.velocity.clone();
    this.ship.rotation = data.ship.rotation; this.ship.fuel = this.ship.maxFuel;
    this.ship.acceleration = Vector2.zero(); this.timeWarpIndex = 0;
    this.camera.setFollowTarget(this.ship); this.camera.mode = 'follow_ship';
  }
}

// ==================== LAUNCH ====================
(async () => {
  const container = document.getElementById('game');
  const game = new Game();
  await game.init(container);
})();
</script>
