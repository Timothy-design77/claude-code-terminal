<script>
"use strict";
class Vector2{
constructor(x=0,y=0){this.x=x;this.y=y}
static zero(){return new Vector2(0,0)}
static fromAngle(a,m=1){return new Vector2(Math.cos(a)*m,Math.sin(a)*m)}
clone(){return new Vector2(this.x,this.y)}
add(v){return new Vector2(this.x+v.x,this.y+v.y)}
sub(v){return new Vector2(this.x-v.x,this.y-v.y)}
scale(s){return new Vector2(this.x*s,this.y*s)}
magnitude(){return Math.sqrt(this.x*this.x+this.y*this.y)}
magnitudeSq(){return this.x*this.x+this.y*this.y}
normalize(){const m=this.magnitude();return m<0.0001?Vector2.zero():new Vector2(this.x/m,this.y/m)}
cross(v){return this.x*v.y-this.y*v.x}
distanceTo(v){return this.sub(v).magnitude()}
distanceToSq(v){return this.sub(v).magnitudeSq()}
angle(){return Math.atan2(this.y,this.x)}
lerp(v,t){return new Vector2(this.x+(v.x-this.x)*t,this.y+(v.y-this.y)*t)}
addMut(v){this.x+=v.x;this.y+=v.y;return this}
scaleMut(s){this.x*=s;this.y*=s;return this}
}
const G=6.674e3,PHYSICS_DT=1/60,TIME_WARP_LEVELS=[1,5,10,50];
class CelestialBody{constructor(c){this.name=c.name;this.mass=c.mass;this.radius=c.radius;this.position=c.position.clone();this.velocity=c.velocity.clone();this.color=c.color;this.atmosphereColor=c.atmosphereColor||0;this.atmosphereRadius=c.atmosphereRadius||0;this.fixed=c.fixed||false;this.acceleration=Vector2.zero()}}
class PhysicsWorld{
constructor(){this.bodies=[]}
addBody(b){this.bodies.push(b)}
calcGrav(pos,exclude){let ax=0,ay=0;for(const b of this.bodies){if(b===exclude)continue;const dx=b.position.x-pos.x,dy=b.position.y-pos.y,dSq=dx*dx+dy*dy;if(dSq<0.01)continue;const s=Math.max(b.radius*0.5,1),eSq=dSq+s*s,eD=Math.sqrt(eSq),f=G*b.mass/eSq;ax+=(dx/eD)*f;ay+=(dy/eD)*f}return new Vector2(ax,ay)}
findDom(pos){let s=null,sf=0;for(const b of this.bodies){const d=pos.distanceToSq(b.position),f=G*b.mass/Math.max(d,1);if(f>sf){sf=f;s=b}}return s}
update(dt){for(const b of this.bodies){if(b.fixed){b.acceleration=Vector2.zero();continue}b.acceleration=this.calcGrav(b.position,b)}
for(const b of this.bodies){if(b.fixed)continue;b.position.x+=b.velocity.x*dt+.5*b.acceleration.x*dt*dt;b.position.y+=b.velocity.y*dt+.5*b.acceleration.y*dt*dt}
const na=[];for(const b of this.bodies){if(b.fixed){na.push(Vector2.zero());continue}na.push(this.calcGrav(b.position,b))}
for(let i=0;i<this.bodies.length;i++){const b=this.bodies[i];if(b.fixed)continue;b.velocity.x+=.5*(b.acceleration.x+na[i].x)*dt;b.velocity.y+=.5*(b.acceleration.y+na[i].y)*dt;b.acceleration=na[i]}}}
class OrbitalMechanics{
static predict(pos,vel,world,steps=300,dt=1){const pts=[];let p=pos.clone(),v=vel.clone(),esc=false,col=false,cb;
const sd=world.findDom(p),sD=sd?p.distanceTo(sd.position):1e9;
for(let i=0;i<steps;i++){const a=world.calcGrav(p);p=new Vector2(p.x+v.x*dt+.5*a.x*dt*dt,p.y+v.y*dt+.5*a.y*dt*dt);const na=world.calcGrav(p);v=new Vector2(v.x+.5*(a.x+na.x)*dt,v.y+.5*(a.y+na.y)*dt);
if(isNaN(p.x)||isNaN(p.y))break;pts.push(p.clone());
for(const b of world.bodies){if(p.distanceTo(b.position)<b.radius){col=true;cb=b;return{pts,esc,col,cb}}}
if(sd&&p.distanceTo(sd.position)>sD*3)esc=true}return{pts,esc,col,cb}}
static orbEl(pos,vel,body){const rp=pos.sub(body.position),rv=vel.sub(body.velocity),r=rp.magnitude(),v=rv.magnitude(),mu=G*body.mass;
if(r<1||mu<1)return null;const en=.5*v*v-mu/r;if(en>=0)return null;
const a=-mu/(2*en),h=rp.cross(rv),eSq=1+(2*en*h*h)/(mu*mu),e=Math.sqrt(Math.max(0,eSq));
const pe=a*(1-e),ap=a*(1+e),T=2*Math.PI*Math.sqrt(Math.abs(a*a*a)/mu);
if(!isFinite(T)||!isFinite(ap))return null;return{ap,pe,e,T,a}}
static circV(body,d){return Math.sqrt(G*body.mass/Math.max(d,1))}}
class Ship{constructor(c){this.position=c.position.clone();this.velocity=c.velocity.clone();this.rotation=c.rotation;this.thrustPower=c.thrustPower;this.rotationSpeed=c.rotationSpeed;this.fuel=c.maxFuel;this.maxFuel=c.maxFuel;this.fuelCons=c.fuelCons;this.isThrusting=false;this.isBoosting=false;this.throttle=1;this.acceleration=Vector2.zero()}
get td(){return Vector2.fromAngle(this.rotation)}
thrust(dt){if(this.fuel<=0||!this.isThrusting)return Vector2.zero();const p=this.isBoosting?this.thrustPower*2.5:this.thrustPower,c=this.isBoosting?this.fuelCons*3:this.fuelCons;this.fuel=Math.max(0,this.fuel-c*dt*this.throttle);return this.td.scale(p*this.throttle)}
rotL(dt){this.rotation-=this.rotationSpeed*dt}rotR(dt){this.rotation+=this.rotationSpeed*dt}
get fp(){return this.maxFuel>0?this.fuel/this.maxFuel:0}
get speed(){return this.velocity.magnitude()}}
function createSolarSystem(){
const w=new PhysicsWorld();
const star=new CelestialBody({name:'Sol',mass:5e6,radius:120,position:Vector2.zero(),velocity:Vector2.zero(),color:0xFFDD44,atmosphereColor:0xFFAA00,atmosphereRadius:168,fixed:true});w.addBody(star);
function mp(n,m,r,d,par,c,ac,ang){const pos=par.position.add(Vector2.fromAngle(ang,d)),spd=OrbitalMechanics.circV(par,d),vel=par.velocity.add(Vector2.fromAngle(ang+Math.PI/2,spd));return new CelestialBody({name:n,mass:m,radius:r,position:pos,velocity:vel,color:c,atmosphereColor:ac||0,atmosphereRadius:ac?r*1.2:0,fixed:false})}
const pl=[mp('Mercury',800,12,1200,star,0xAAAA88,0,.5),mp('Venus',2000,20,2200,star,0xDDAA55,0xFFCC88,1.2),mp('Earth',3000,24,3500,star,0x4488FF,0x88BBFF,2.1),mp('Mars',1500,16,5000,star,0xCC6644,0xDD8866,3.5),mp('Jupiter',15000,50,8000,star,0xDDBB88,0xEECC99,4.8)];
pl.forEach(p=>w.addBody(p));const earth=pl[2],mars=pl[3],jup=pl[4];
[mp('Luna',200,8,200,earth,0xCCCCCC,0,0),mp('Phobos',80,5,120,mars,0xAA9988,0,1),mp('Europa',300,10,250,jup,0xBBCCDD,0,.5),mp('Io',250,9,160,jup,0xDDCC44,0,2)].forEach(m=>w.addBody(m));
const sd=100,sp=earth.position.add(Vector2.fromAngle(0,sd)),sv=earth.velocity.add(Vector2.fromAngle(Math.PI/2,OrbitalMechanics.circV(earth,sd)));
const ship=new Ship({position:sp,velocity:sv,rotation:-Math.PI/2,thrustPower:50,rotationSpeed:3,maxFuel:1000,fuelCons:2});
return{w,star,pl,ship}}
class Camera{constructor(){this.position=Vector2.zero();this.zoom=1;this.targetZoom=1;this.mode='follow';this.target=null;this.sw=0;this.sh=0}
setSz(w,h){this.sw=w;this.sh=h}setTarget(t){this.target=t;if(t)this.mode='follow'}
adjZoom(d){this.targetZoom=Math.max(.001,Math.min(5,this.targetZoom*(d>0?.9:1.1)))}
update(){this.zoom+=(this.targetZoom-this.zoom)*.15;if(this.mode==='follow'&&this.target)this.position=this.position.lerp(this.target.position,.1)}
w2s(p){return new Vector2((p.x-this.position.x)*this.zoom+this.sw/2,(p.y-this.position.y)*this.zoom+this.sh/2)}
w2ss(d){return d*this.zoom}
pan(dx,dy){this.position=this.position.add(new Vector2(dx/this.zoom,dy/this.zoom))}}
class InputManager{
constructor(){this.keys=new Set();this.jp=new Set();this._pd=0;this._sd=0;this.lpd=0;this._m=false;this.cv=null}
get isMobile(){return this._m}get pinchDelta(){return this._pd}
init(c){this.cv=c;this._m='ontouchstart'in window||navigator.maxTouchPoints>0;
window.addEventListener('keydown',this._kd);window.addEventListener('keyup',this._ku);
c.addEventListener('wheel',this._wh,{passive:false});
c.addEventListener('touchstart',this._ts,{passive:false});c.addEventListener('touchmove',this._tm,{passive:false});
c.addEventListener('touchend',this._te,{passive:false});c.addEventListener('touchcancel',this._te,{passive:false})}
destroy(){window.removeEventListener('keydown',this._kd);window.removeEventListener('keyup',this._ku);
if(this.cv){this.cv.removeEventListener('wheel',this._wh);this.cv.removeEventListener('touchstart',this._ts);this.cv.removeEventListener('touchmove',this._tm);this.cv.removeEventListener('touchend',this._te);this.cv.removeEventListener('touchcancel',this._te)}}
ef(){this.jp.clear();this._sd=0;this._pd=0}
kd(k){return this.keys.has(k.toLowerCase())}kjp(k){return this.jp.has(k.toLowerCase())}gsd(){return this._sd}
skd(k){k=k.toLowerCase();if(!this.keys.has(k))this.jp.add(k);this.keys.add(k)}sku(k){this.keys.delete(k.toLowerCase())}
_kd=(e)=>{const k=e.key.toLowerCase();if(!this.keys.has(k))this.jp.add(k);this.keys.add(k);if('wasdc ,.shift'.includes(k)||k==='tab')e.preventDefault()};
_ku=(e)=>{this.keys.delete(e.key.toLowerCase())};
_wh=(e)=>{e.preventDefault();this._sd+=e.deltaY};
_ts=(e)=>{e.preventDefault();if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];this.lpd=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY)}};
_tm=(e)=>{e.preventDefault();if(e.touches.length===2){const a=e.touches[0],b=e.touches[1],d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);if(this.lpd>0)this._pd+=(this.lpd-d)*3;this.lpd=d}};
_te=(e)=>{e.preventDefault();if(e.touches.length<2)this.lpd=0}}
class Starfield{constructor(w,h){this.c=new PIXI.Container();this.ls=[];this.w=w;this.h=h;this._mk(200,.02,.5,1);this._mk(100,.05,1,1.5);this._mk(50,.1,1.5,2.5)}
_mk(n,pf,mn,mx){const g=new PIXI.Graphics(),st=[];for(let i=0;i<n;i++)st.push({x:(Math.random()-.5)*4000,y:(Math.random()-.5)*4000,b:.3+Math.random()*.7,s:mn+Math.random()*(mx-mn)});this.c.addChild(g);this.ls.push({g,st,pf})}
render(cam){for(const l of this.ls){l.g.clear();const ox=-cam.position.x*l.pf,oy=-cam.position.y*l.pf;for(const s of l.st){const sx=((s.x+ox)%this.w+this.w)%this.w,sy=((s.y+oy)%this.h+this.h)%this.h;l.g.circle(sx,sy,s.s);l.g.fill({color:s.b>.8?0xCCDDFF:s.b>.5?0xFFFFFF:0xAABBCC,alpha:s.b*.85})}}}}
class PlanetRenderer{constructor(){this.c=new PIXI.Container();this.g=new PIXI.Graphics();this.c.addChild(this.g)}
render(bodies,cam){this.g.clear();for(const b of bodies){const sp=cam.w2s(b.position),sr=cam.w2ss(b.radius);if(sp.x<-sr*2||sp.x>cam.sw+sr*2||sp.y<-sr*2||sp.y>cam.sh+sr*2||sr<.5)continue;
if(b.atmosphereColor&&b.atmosphereRadius>b.radius){const ar=cam.w2ss(b.atmosphereRadius);this.g.circle(sp.x,sp.y,ar);this.g.fill({color:b.atmosphereColor,alpha:.08});this.g.circle(sp.x,sp.y,sr+(ar-sr)*.5);this.g.fill({color:b.atmosphereColor,alpha:.12})}
this.g.circle(sp.x,sp.y,sr);this.g.fill({color:b.color});if(sr>3){this.g.circle(sp.x+sr*.15,sp.y-sr*.1,sr);this.g.fill({color:0,alpha:.2})}
if(b.fixed&&sr>2){for(let i=1;i<=3;i++){this.g.circle(sp.x,sp.y,sr*(1+i*.4));this.g.fill({color:b.atmosphereColor||b.color,alpha:.04/i})}}}}}
class ShipRenderer{constructor(){this.c=new PIXI.Container();this.g=new PIXI.Graphics();this.c.addChild(this.g)}
render(ship,cam){this.g.clear();const sp=cam.w2s(ship.position),sc=Math.max(1,cam.zoom*12);
const n=Vector2.fromAngle(ship.rotation,sc*1.2),lw=Vector2.fromAngle(ship.rotation+Math.PI*.8,sc*.8),rw=Vector2.fromAngle(ship.rotation-Math.PI*.8,sc*.8),tl=Vector2.fromAngle(ship.rotation+Math.PI,sc*.4);
const pts=[{x:sp.x+n.x,y:sp.y+n.y},{x:sp.x+lw.x,y:sp.y+lw.y},{x:sp.x+tl.x,y:sp.y+tl.y},{x:sp.x+rw.x,y:sp.y+rw.y}];
this.g.poly(pts);this.g.fill({color:0x88CCFF,alpha:.9});this.g.poly(pts);this.g.stroke({color:0x44AAFF,width:2,alpha:.4});
if(ship.isThrusting&&ship.fuel>0){const fd=Vector2.fromAngle(ship.rotation+Math.PI),fl=sc*(.8+Math.random()*.6)*(ship.isBoosting?1.8:1);
const fb1=Vector2.fromAngle(ship.rotation+Math.PI*.9,sc*.3),fb2=Vector2.fromAngle(ship.rotation-Math.PI*.9,sc*.3),ft=fd.scale(fl);
this.g.poly([{x:sp.x+fb1.x,y:sp.y+fb1.y},{x:sp.x+ft.x,y:sp.y+ft.y},{x:sp.x+fb2.x,y:sp.y+fb2.y}]);
this.g.fill({color:ship.isBoosting?0xFF4400:0xFF8800,alpha:.7});
const it=fd.scale(fl*.6),ib1=Vector2.fromAngle(ship.rotation+Math.PI*.92,sc*.15),ib2=Vector2.fromAngle(ship.rotation-Math.PI*.92,sc*.15);
this.g.poly([{x:sp.x+ib1.x,y:sp.y+ib1.y},{x:sp.x+it.x,y:sp.y+it.y},{x:sp.x+ib2.x,y:sp.y+ib2.y}]);
this.g.fill({color:0xFFDD44,alpha:.9})}}}
class ParticleSystem{constructor(){this.c=new PIXI.Container();this.g=new PIXI.Graphics();this.c.addChild(this.g);this.ps=[];this.pool=[]}
emit(pos,vel,n,cfg){for(let i=0;i<n;i++){if(this.ps.length>=300)break;const a=vel.angle()+(Math.random()-.5)*cfg.spread,s=cfg.speed*(.5+Math.random()*.5);
const p=this.pool.length>0?this.pool.pop():{};p.pos=pos.clone();p.vel=Vector2.fromAngle(a,s).add(vel.scale(.3));p.life=cfg.life;p.ml=cfg.life;p.col=cfg.color;p.sz=cfg.size*(.5+Math.random()*.5);this.ps.push(p)}}
update(dt){for(let i=this.ps.length-1;i>=0;i--){const p=this.ps[i];p.pos.addMut(p.vel.scale(dt));p.vel.scaleMut(.98);p.life-=dt;if(p.life<=0)this.pool.push(this.ps.splice(i,1)[0])}}
render(cam){this.g.clear();for(const p of this.ps){const sp=cam.w2s(p.pos);this.g.circle(sp.x,sp.y,Math.max(1,p.sz*cam.zoom));this.g.fill({color:p.col,alpha:(p.life/p.ml)*.8})}}}
class OrbitRenderer{constructor(){this.c=new PIXI.Container();this.g=new PIXI.Graphics();this.c.addChild(this.g)}
render(pred,cam){this.g.clear();if(!pred||pred.pts.length<2)return;const pts=pred.pts,col=pred.col?0xFF4444:pred.esc?0xFF8844:0x44FF88,tot=pts.length,seg=Math.max(1,Math.floor(tot/100));
for(let i=0;i<tot-seg;i+=seg){const p1=cam.w2s(pts[i]),p2=cam.w2s(pts[Math.min(i+seg,tot-1)]);this.g.moveTo(p1.x,p1.y);this.g.lineTo(p2.x,p2.y);this.g.stroke({color:col,width:1.5,alpha:.5*(1-i/tot)})}}
orbits(bodies,center,cam){for(const b of bodies){const or=Math.hypot(b.position.x-center.x,b.position.y-center.y),sc=cam.w2s(center),sr=cam.w2ss(or);if(sr>5&&sr<8000){this.g.circle(sc.x,sc.y,sr);this.g.stroke({color:0xFFFFFF,width:.5,alpha:.06})}}}}
class HUD{constructor(sw,sh,mob){this.c=new PIXI.Container();this.sw=sw;this.sh=sh;this.mob=mob;
const ms=mob?11:13,ds=mob?9:11,pad=mob?10:16,lh=mob?15:18;
const mS={fontFamily:'monospace',fontSize:ms,fill:0x88CCFF},dS={fontFamily:'monospace',fontSize:ds,fill:0x667788},aS={fontFamily:'monospace',fontSize:ms,fill:0x44FF88},wS={fontFamily:'monospace',fontSize:mob?12:14,fill:0xFFDD44};
this.vt=new PIXI.Text({text:'',style:mS});this.vt.position.set(pad,pad);this.c.addChild(this.vt);
this.at=new PIXI.Text({text:'',style:mS});this.at.position.set(pad,pad+lh);this.c.addChild(this.at);
this.bt=new PIXI.Text({text:'',style:aS});this.bt.position.set(pad,pad+lh*2);this.c.addChild(this.bt);
this.ot=new PIXI.Text({text:'',style:dS});this.ot.position.set(pad,pad+lh*3);this.c.addChild(this.ot);
this.wt=new PIXI.Text({text:'',style:wS});this.wt.anchor.set(.5,0);this.wt.position.set(sw/2,pad);this.c.addChild(this.wt);
const fbo=mob?190:40;this.fbo=fbo;this.pad=pad;
this.fb=new PIXI.Graphics();this.fb.position.set(pad,sh-fbo);this.c.addChild(this.fb);
this.ft=new PIXI.Text({text:'',style:mS});this.ft.position.set(pad,sh-fbo-18);this.c.addChild(this.ft);
if(!mob){this.ct=new PIXI.Text({text:'W:Thrust A/D:Rotate Shift:Boost ,/.:Warp R:Reset',style:dS});this.ct.anchor.set(1,1);this.ct.position.set(sw-pad,sh-pad);this.c.addChild(this.ct)}}
update(ship,dom,tw){this.vt.text=`VEL ${ship.speed.toFixed(1)} m/s`;
if(dom){const alt=ship.position.distanceTo(dom.position)-dom.radius;this.at.text=`ALT ${alt.toFixed(0)} m`;this.bt.text=`SOI: ${dom.name}`;
const el=OrbitalMechanics.orbEl(ship.position,ship.velocity,dom);
this.ot.text=el?(this.mob?`AP:${el.ap.toFixed(0)} PE:${el.pe.toFixed(0)} E:${el.e.toFixed(2)}`:`AP:${el.ap.toFixed(0)} PE:${el.pe.toFixed(0)} ECC:${el.e.toFixed(3)} T:${el.T.toFixed(1)}s`):'ESCAPE TRAJECTORY'}
else{this.at.text='ALT ---';this.bt.text='SOI: Deep Space';this.ot.text=''}
this.wt.text=tw>1?`>>> x${tw} >>>` :'';
this.fb.clear();const bw=this.mob?Math.min(150,this.sw*.35):200,bh=this.mob?6:8;
this.fb.rect(0,0,bw,bh);this.fb.fill({color:0x222233});
this.fb.rect(0,0,bw*ship.fp,bh);this.fb.fill({color:ship.fp>.3?0x44FF88:ship.fp>.1?0xFFDD44:0xFF4444});
this.fb.rect(0,0,bw,bh);this.fb.stroke({color:0x445566,width:1});
this.ft.text=`FUEL ${(ship.fp*100).toFixed(0)}%`}
resize(w,h){this.sw=w;this.sh=h;this.wt.position.set(w/2,this.pad);this.fb.position.set(this.pad,h-this.fbo);this.ft.position.set(this.pad,h-this.fbo-18);if(this.ct)this.ct.position.set(w-this.pad,h-this.pad)}}
class Minimap{constructor(sz){this.sz=sz;this.c=new PIXI.Container();this.bg=new PIXI.Graphics();this.c.addChild(this.bg);this.g=new PIXI.Graphics();this.c.addChild(this.g);this.ms=.012}
setPos(sw,sh){this.c.position.set(sw-this.sz-12,12)}
render(bodies,ship){this.bg.clear();this.g.clear();this.bg.roundRect(0,0,this.sz,this.sz,4);this.bg.fill({color:0x0a0a14,alpha:.8});this.bg.roundRect(0,0,this.sz,this.sz,4);this.bg.stroke({color:0x334455,width:1});
const cx=this.sz/2;for(const b of bodies){const mx=cx+b.position.x*this.ms,my=cx+b.position.y*this.ms;if(mx<-5||mx>this.sz+5||my<-5||my>this.sz+5)continue;this.g.circle(mx,my,b.fixed?4:Math.max(1.5,b.radius*this.ms*2));this.g.fill({color:b.color})}
const sx=cx+ship.position.x*this.ms,sy=cx+ship.position.y*this.ms;const clx=Math.max(3,Math.min(this.sz-3,sx)),cly=Math.max(3,Math.min(this.sz-3,sy));
this.g.circle(clx,cly,2.5);this.g.fill({color:0x44AAFF})}

class TouchControls{
constructor(inp,sw,sh){this.inp=inp;this.sw=sw;this.sh=sh;this.visible=false;this.cv=null;
this.c=new PIXI.Container();this.g=new PIXI.Graphics();this.c.addChild(this.g);this.labels=new Map();
this.jB={x:0,y:0,r:60};this.jK={x:0,y:0,r:24};this.jOn=false;this.jTid=null;
this.btns=[];this.tBtns=[];this._setup();this._mkLabels();

_rl(){this.inp.sku('a');this.inp.sku('d');this.inp.sku('w');this.inp.sku('s');this.inp.sku('shift');this.inp.sku('r');this.inp.sku(',');this.inp.sku('.');

_ts=(e)=>{if(!this.visible)return;for(let i=0;i<e.changedTouches.length;i++){const t=e.changedTouches[i],{x,y}=this._cc(t.clientX,t.clientY);

_tm=(e)=>{if(!this.visible)return;for(let i=0;i<e.changedTouches.length;i++){const t=e.changedTouches[i];if(t.identifier===this.jTid){const{x,y}=this._cc(t.clientX,t.clientY);this._uj(x,y)}}};
_te=(e)=>{if(!this.visible)return;for(let i=0;i<e.changedTouches.length;i++){const t=e.changedTouches[i];
if(t.identifier===this.jTid){this.jOn=false;this.jTid=null;this.jK.x=this.jB.x;this.jK.y=this.jB.y;this.inp.sku('a');this.inp.sku('d');this.inp.sku('w');this.inp.sku('s')}
for(const b of[...this.btns,...this.tBtns]){if(b.tid===t.identifier){b.on=false;b.tid=null;if(b.k[0]!=='_')this.inp.sku(b.k)}}}

_uj(tx,ty){const dx=tx-this.jB.x,dy=ty-this.jB.y,d=Math.hypot(dx,dy),m=this.jB.r,cd=Math.min(d,m),a=Math.atan2(dy,dx);

const kc=this.jOn?0x44AAFF:0x6688AA,ka=this.jOn?.8:.5;this.g.circle(this.jK.x,this.jK.y,this.jK.r);this.g.fill({color:kc,alpha:ka});this.g.circle(this.jK.x,this.jK.y,this.jK.r);this.g.stroke({color:0x88CCFF,width:1.5,alpha:ka});
for(const b of this.btns){const c=b.on?this._ac(b.id):0x112233,a=b.on?.7:.35;this.g.circle(b.x,b.y,b.r);this.g.fill({color:c,alpha:a});this.g.circle(b.x,b.y,b.r);this.g.stroke({color:b.on?c:0x334466,width:2,alpha:a+.2});const l=this.labels.get(b.id);if(l)l.style.fill=b.on?0xFFFFFF:0xAABBCC}
for(const b of this.tBtns){const a=b.on?.6:.3;this.g.circle(b.x,b.y,b.r);this.g.fill({color:b.on?0x445566:0x112233,alpha:a});this.g.circle(b.x,b.y,b.r);this.g.stroke({color:0x445566,width:1.5,alpha:a+.15})}}
_ac(id){return id==='thr'?0xFF8800:id==='bst'?0xFF4400:0x4488FF}
resize(w,h){this.sw=w;this.sh=h;this._setup();this._mkLabels()}}
class Game{
constructor(){this.app=new PIXI.Application();this.cam=new Camera();this.inp=new InputManager();this.twi=0;this.op=null;this.opt=0;this.running=false;this.acc=0;this.lt=0}
async init(el){const w=el.clientWidth,h=el.clientHeight;
await this.app.init({width:w,height:h,backgroundColor:0x050510,antialias:true,resolution:window.devicePixelRatio||1,autoDensity:true});
el.appendChild(this.app.canvas);this.inp.init(this.app.canvas);this.cam.setSz(w,h);
this._initWorld();
const mob=this.inp.isMobile;
this.sf=new Starfield(w,h);this.pr=new PlanetRenderer();this.sr=new ShipRenderer();this.ps=new ParticleSystem();this.or=new OrbitRenderer();
this.hud=new HUD(w,h,mob);this.mm=new Minimap(mob?Math.min(120,Math.floor(w*.28)):180);this.mm.setPos(w,h);
this.tc=new TouchControls(this.inp,w,h);this.tc.setCanvas(this.app.canvas);this.tc.visible=mob;
this.app.stage.addChild(this.sf.c);this.app.stage.addChild(this.or.c);this.app.stage.addChild(this.pr.c);
this.app.stage.addChild(this.sr.c);this.app.stage.addChild(this.ps.c);
this.app.stage.addChild(this.hud.c);this.app.stage.addChild(this.mm.c);this.app.stage.addChild(this.tc.c);
this.cam.setTarget(this.ship);this.cam.targetZoom=.8;

_initWorld(){const d=createSolarSystem();this.world=d.w;this.star=d.star;this.ship=d.ship;this.op=null;this.opt=0;this.twi=0}
destroy(){this.running=false;window.removeEventListener('resize',this._rsz);this.inp.destroy();this.tc.destroy();this.app.destroy(true,{children:true})}
_rsz=()=>{const p=this.app.canvas.parentElement;if(!p)return;const w=p.clientWidth,h=p.clientHeight;this.app.renderer.resize(w,h);this.cam.setSz(w,h);this.hud.resize(w,h);this.mm.resize(w,h);this.tc.resize(w,h)};
_loop=()=>{if(!this.running)return;const now=performance.now(),ft=Math.min((now-this.lt)/1000,.1);this.lt=now;
this.acc+=ft*TIME_WARP_LEVELS[this.twi];while(this.acc>=PHYSICS_DT){this._inp(PHYSICS_DT);this._phys(PHYSICS_DT);this.acc-=PHYSICS_DT}
this._draw();this.inp.ef();requestAnimationFrame(this._loop)};
_inp(dt){
this.ship.isThrusting=this.inp.kd('w')||this.inp.kd('arrowup');
this.ship.isBoosting=this.inp.kd('shift');
if(this.inp.kd('a')||this.inp.kd('arrowleft'))this.ship.rotL(dt);
if(this.inp.kd('d')||this.inp.kd('arrowright'))this.ship.rotR(dt);
if(this.inp.kjp('.'))this.twi=Math.min(this.twi+1,TIME_WARP_LEVELS.length-1);
if(this.inp.kjp(','))this.twi=Math.max(this.twi-1,0);
const z=this.inp.gsd()+this.inp.pinchDelta+this.tc.gzd();if(z)this.cam.adjZoom(z);
if(this.inp.kjp('c')){if(this.cam.mode==='follow')this.cam.mode='free';else{this.cam.mode='follow';this.cam.setTarget(this.ship)}}
if(this.cam.mode==='free'){const ps=500/this.cam.zoom;if(this.inp.kd('w'))this.cam.pan(0,-ps*dt);if(this.inp.kd('s'))this.cam.pan(0,ps*dt);if(this.inp.kd('a'))this.cam.pan(-ps*dt,0);if(this.inp.kd('d'))this.cam.pan(ps*dt,0)}

_phys(dt){
this.world.update(dt);
const grav=this.world.calcGrav(this.ship.position);const thr=this.ship.thrust(dt);const ta=grav.add(thr);
this.ship.position.x+=this.ship.velocity.x*dt+.5*this.ship.acceleration.x*dt*dt;
this.ship.position.y+=this.ship.velocity.y*dt+.5*this.ship.acceleration.y*dt*dt;
const ng=this.world.calcGrav(this.ship.position);
const nt=this.ship.isThrusting?this.ship.td.scale(this.ship.isBoosting?this.ship.thrustPower*2.5:this.ship.thrustPower).scale(this.ship.fuel>0?this.ship.throttle:0):Vector2.zero();

(async()=>{try{const g=new Game();await g.init(document.getElementById('game'))}catch(e){document.body.innerHTML='<p style="color:red;padding:20px;font-family:monospace">Error: '+e.message+'</p>'}})();
</script></body></html>
